name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, linux, x64, hermes-mobile-ci]
    timeout-minutes: 35
    steps:
      - name: Detect already-validated PR merge push
        id: validated-pr-merge
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -u
          echo 'skip=false' >> "$GITHUB_OUTPUT"

          pr_number="$(printf '%s\n' "$COMMIT_MESSAGE" | sed -nE '1s/.*\(#([0-9]+)\)$/\1/p')"
          if [ -z "$pr_number" ] || ! command -v python3 >/dev/null 2>&1; then
            exit 0
          fi

          response_file="${RUNNER_TEMP}/validated-pr-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}.json"
          trap 'rm -f "$response_file"' EXIT

          if ! curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${GH_TOKEN}" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/${pr_number}" \
            > "$response_file" 2>/dev/null; then
            exit 0
          fi

          if [ ! -s "$response_file" ]; then
            exit 0
          fi

          if python3 - "$response_file" "$GITHUB_SHA" <<'PY'
          import json
          import sys

          path, expected_sha = sys.argv[1], sys.argv[2]
          try:
              with open(path, encoding='utf-8') as handle:
                  pull = json.load(handle)
          except (OSError, json.JSONDecodeError):
              raise SystemExit(1)

          valid = (
              pull.get('merge_commit_sha') == expected_sha
              and bool(pull.get('merged_at'))
              and isinstance(pull.get('base'), dict)
              and pull['base'].get('ref') == 'main'
          )
          raise SystemExit(0 if valid else 1)
          PY
          then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Skipping duplicate push validation for an already validated merged PR.'
          fi

      - name: Checkout
        if: steps.validated-pr-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ ! -d .git ]; then
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          git clean -ffdx
          git reset --hard HEAD >/dev/null 2>&1 || true

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER='${{ github.event.pull_request.number }}'
            PR_HEAD_SHA='${{ github.event.pull_request.head.sha }}'
            PR_BASE_REF='${{ github.base_ref }}'
            git fetch --prune --no-tags origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
            git checkout --detach "refs/remotes/pull/${PR_NUMBER}/merge"
            test "$(git rev-parse HEAD^1)" = "$(git rev-parse "refs/remotes/origin/${PR_BASE_REF}")"
            test "$(git rev-parse HEAD^2)" = "$PR_HEAD_SHA"
          else
            git fetch --prune --no-tags origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              "+${GITHUB_SHA}:refs/remotes/ci/target"
            git checkout --detach refs/remotes/ci/target
            test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          fi

      - name: Determine validation scope
        id: scope
        if: steps.validated-pr-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          full=true
          if [ "$GITHUB_EVENT_NAME" = 'pull_request' ]; then
            if git diff --name-only HEAD^1 HEAD^2 | grep -Ev '^(docs/|.*\.md$)' | grep -q .; then
              full=true
            else
              full=false
            fi
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "Full validation required: $full"

      - name: Set up Node.js
        if: steps.validated-pr-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOOL_CACHE="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is required on Hermes}"
          NODE_BIN="$(find "$TOOL_CACHE/node" -type f -path '*/22.*/x64/bin/node' -print | sort -V | tail -n 1)"
          test -n "$NODE_BIN"
          NODE_DIR="$(dirname "$NODE_BIN")"
          test "$("$NODE_BIN" -p 'process.versions.node.split(".")[0]')" = '22'
          export PATH="$NODE_DIR:$PATH"
          echo "$NODE_DIR" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Install dependencies
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        run: npm ci

      - name: Repository file line audit
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: node scripts/check-repository-file-lines.mjs

      - name: Changed file line limit
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: node scripts/check-changed-file-lines.mjs

      - name: Agent navigation integrity
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npm run agent:check

      - name: TypeScript
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        run: npm run typecheck

      - name: Full regression suite
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee "${RUNNER_TEMP}/full-regression.log"

      - name: Upload full regression log
        if: always() && steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: full-regression-${{ github.run_id }}
          path: ${{ runner.temp }}/full-regression.log
          if-no-files-found: error

      - name: Smoke expanded model runner
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        env:
          EXPECTED_MOBILE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SYNC_INTENT_PROPERTY_SEED_COUNT: '129'
          SYNC_INTENT_PROPERTY_EVIDENCE_PATH: expanded-model-smoke-evidence.json
        run: node scripts/run-expanded-sync-intent-model.mjs

      - name: Expo export
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        run: npx expo export --clear

      - name: Expo Doctor
        if: steps.validated-pr-merge.outputs.skip != 'true' && steps.scope.outputs.full == 'true'
        run: npx expo-doctor@1.20.1
