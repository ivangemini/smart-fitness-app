name: Mobile CI

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: mobile-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: [self-hosted, linux, x64, hermes-mobile-ci]
    timeout-minutes: 35
    steps:
      - name: Detect already-validated PR merge push
        id: validated-pr-merge
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -u
          echo 'skip=false' >> "$GITHUB_OUTPUT"

          response="$({
            curl --fail-with-body --silent --show-error \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header 'Accept: application/vnd.github+json' \
              --header 'X-GitHub-Api-Version: 2022-11-28' \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls?per_page=10"
          } 2>/dev/null || true)"

          if [ -z "$response" ]; then
            exit 0
          fi

          if printf '%s' "$response" | grep -Eq "\"merge_commit_sha\"[[:space:]]*:[[:space:]]*\"${GITHUB_SHA}\"" \
            && printf '%s' "$response" | grep -Eq '"merged_at"[[:space:]]*:[[:space:]]*"[^"]+"' \
            && printf '%s' "$response" | grep -Eq '"base"[[:space:]]*:[[:space:]]*\{[^}]*"ref"[[:space:]]*:[[:space:]]*"main"'; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo 'Skipping duplicate push validation for an already validated merged PR.'
          fi

      - name: Checkout
        if: steps.validated-pr-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          if [ ! -d .git ]; then
            git init .
          fi
          if git remote get-url origin >/dev/null 2>&1; then
            git remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          else
            git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          fi

          git clean -ffdx
          git reset --hard HEAD >/dev/null 2>&1 || true

          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER='${{ github.event.pull_request.number }}'
            git fetch --prune --no-tags origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              "+refs/pull/${PR_NUMBER}/merge:refs/remotes/pull/${PR_NUMBER}/merge"
            git checkout --detach "refs/remotes/pull/${PR_NUMBER}/merge"
          else
            git fetch --prune --no-tags origin \
              '+refs/heads/*:refs/remotes/origin/*' \
              "+${GITHUB_SHA}:refs/remotes/ci/target"
            git checkout --detach refs/remotes/ci/target
          fi

          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Set up Node.js
        if: steps.validated-pr-merge.outputs.skip != 'true'
        shell: bash
        run: |
          set -euo pipefail
          TOOL_CACHE="${RUNNER_TOOL_CACHE:?RUNNER_TOOL_CACHE is required on Hermes}"
          NODE_BIN="$(find "$TOOL_CACHE/node" -type f -path '*/22.*/x64/bin/node' -print | sort -V | tail -n 1)"
          test -n "$NODE_BIN"
          NODE_DIR="$(dirname "$NODE_BIN")"
          test "$("$NODE_BIN" -p 'process.versions.node.split(".")[0]')" = '22'
          export PATH="$NODE_DIR:$PATH"
          echo "$NODE_DIR" >> "$GITHUB_PATH"
          node --version
          npm --version

      - name: Install dependencies
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npm ci

      - name: Repository file line audit
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: node scripts/check-repository-file-lines.mjs

      - name: Changed file line limit
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: node scripts/check-changed-file-lines.mjs

      - name: TypeScript
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npm run typecheck

      - name: Full regression suite
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npm test

      - name: Smoke expanded model runner
        if: steps.validated-pr-merge.outputs.skip != 'true'
        env:
          EXPECTED_MOBILE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          SYNC_INTENT_PROPERTY_SEED_COUNT: '129'
          SYNC_INTENT_PROPERTY_EVIDENCE_PATH: expanded-model-smoke-evidence.json
        run: node scripts/run-expanded-sync-intent-model.mjs

      - name: Expo export
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npx expo export --clear

      - name: Expo Doctor
        if: steps.validated-pr-merge.outputs.skip != 'true'
        run: npx expo-doctor@1.20.1
